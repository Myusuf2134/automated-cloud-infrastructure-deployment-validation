name: Tests and Terraform Validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline tests
        run: pytest -q
      - name: Build sample service
        run: docker build -t deployment-demo ./app
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.7"
      - name: Check Terraform formatting
        run: terraform -chdir=infrastructure fmt -check
      - name: Initialize Terraform without a backend
        run: terraform -chdir=infrastructure init -backend=false
      - name: Validate Terraform
        run: terraform -chdir=infrastructure validate

      # No plan or apply runs in CI: the AMI lookup and deployment require an
      # explicitly selected AWS account/region and human cost review.
